name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --fix-missing \
            build-essential \
            git \
            ffmpeg \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            libssl-dev \
            openssl \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            libreadline-dev \
            libffi-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            ccache \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config
          pip install --upgrade pip setuptools
          pip install buildozer cython

      - name: Build APK with Buildozer
        run: |
          # Automatically accept SDK licenses in non-interactive environment
          yes | buildozer -s android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-app-apk
          path: bin/*.apk
