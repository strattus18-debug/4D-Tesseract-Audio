name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --fix-missing \
            build-essential \
            git \
            ffmpeg \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            libssl-dev \
            openssl \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            libreadline-dev \
            libffi-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            ccache \
            zip \
            unzip
          pip install --upgrade pip setuptools
          pip install buildozer cython

      - name: Configure buildozer.spec and Build APK
        run: |
          # Generate buildozer.spec if missing
          [ -f buildozer.spec ] || buildozer init
          
          # Configure essential spec values for Kivy
          sed -i 's/^title =.*/title = Alchemy Engine/' buildozer.spec
          sed -i 's/^package.name =.*/package.name = alchemyengine/' buildozer.spec
          sed -i 's/^package.domain =.*/package.domain = org.test/' buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3,kivy/' buildozer.spec
          
          # Accept Android SDK licenses automatically and run build
          yes | buildozer -s android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-app-apk
          path: bin/*.apk
          
