Name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y --fix-missing \
            build-essential \
            git \
            ffmpeg \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            libssl-dev \
            openssl \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            libreadline-dev \
            libffi-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            ccache \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            libltdl-dev \
            autopoint \
            m4 \
            gettext \
            pkg-config
          pip install --upgrade pip setuptools
          pip install buildozer "cython<3.0.0"

      - name: Create buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Alchemy Engine
          package.name = alchemyengine
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy==2.3.0,cython==0.29.33
          orientation = portrait
          fullscreen = 0
          
          android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.accept_sdk_licenses = True
          android.archs = arm64-v8a, armeabi-v7a

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -s android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-app-apk
          path: bin/*.apk
          
